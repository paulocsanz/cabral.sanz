<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Paulo Cabral Sanz</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#11100e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="admin-body">
    <div class="noise" aria-hidden="true"></div>
    <div class="rails" aria-hidden="true"></div>

    <main class="admin-main">
      <section id="view-login" class="admin-view" hidden>
        <p class="kicker">Admin</p>
        <h1 class="admin-title">Entrar</h1>
        <form id="login-form" class="admin-form">
          <label>
            Senha
            <input type="password" id="login-password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="admin-btn">Entrar</button>
          <p id="login-error" class="admin-error" role="alert" hidden></p>
        </form>
      </section>

      <section id="view-list" class="admin-view" hidden>
        <div class="admin-head">
          <div>
            <p class="kicker">Admin</p>
            <h1 class="admin-title">Posts</h1>
          </div>
          <div class="admin-actions">
            <a class="admin-btn admin-btn-ghost" href="/blog/">Ver blog</a>
            <button type="button" id="btn-new" class="admin-btn">Novo post</button>
            <button type="button" id="btn-logout" class="admin-btn admin-btn-ghost">Sair</button>
          </div>
        </div>
        <p class="admin-note">
          Rascunhos só aparecem no blog público depois de publicados. Dá para
          editar, publicar, despublicar e excluir daqui.
        </p>
        <ul id="post-list" class="admin-list"></ul>
        <p id="list-empty" class="admin-empty" hidden>Nenhum post ainda.</p>
        <p id="list-error" class="admin-error" role="alert" hidden></p>
      </section>

      <section id="view-edit" class="admin-view" hidden>
        <p class="kicker"><a href="#" id="back-link">← Posts</a></p>
        <h1 class="admin-title" id="editor-title">Editar post</h1>
        <p id="editor-status" class="admin-note"></p>
        <form id="editor-form" class="admin-form admin-editor">
          <div class="admin-row">
            <label>
              Slug (URL)
              <input type="text" id="f-slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required />
            </label>
            <label>
              Data
              <input type="date" id="f-date" required />
            </label>
          </div>
          <div class="admin-bilingual">
            <label>
              Título (pt-BR)
              <input type="text" id="f-title-pt" required />
            </label>
            <label>
              Título (en)
              <input type="text" id="f-title-en" required />
            </label>
          </div>
          <div class="admin-bilingual">
            <label>
              Corpo (pt-BR) — HTML
              <textarea id="f-body-pt" rows="16"></textarea>
            </label>
            <label>
              Corpo (en) — HTML
              <textarea id="f-body-en" rows="16"></textarea>
            </label>
          </div>
          <div class="admin-actions">
            <button type="submit" class="admin-btn" id="btn-save">Salvar</button>
            <button type="button" id="btn-publish" class="admin-btn admin-btn-publish">Publicar</button>
            <button type="button" id="btn-unpublish" class="admin-btn admin-btn-ghost">Despublicar</button>
            <button type="button" id="btn-delete" class="admin-btn admin-btn-danger">Excluir</button>
          </div>
          <p id="editor-error" class="admin-error" role="alert" hidden></p>
          <p id="editor-ok" class="admin-ok" role="status" hidden></p>
        </form>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var state = { authenticated: false, editingSlug: null, isNew: false, draft: true, slugTouched: false };
        var $ = function (id) { return document.getElementById(id); };

        function show(view) {
          ["login", "list", "edit"].forEach(function (v) {
            $("view-" + v).hidden = v !== view;
          });
        }

        function api(method, path, body) {
          return fetch(path, {
            method: method,
            headers: body ? { "Content-Type": "application/json" } : {},
            body: body ? JSON.stringify(body) : undefined,
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (!res.ok) throw new Error(data.error || "Erro " + res.status);
              return data;
            });
          });
        }

        function alert_(id, message) {
          var el = $(id);
          el.textContent = message;
          el.hidden = !message;
        }

        function slugify(value) {
          return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 80);
        }

        function fields() {
          return {
            date: $("f-date").value,
            titlePt: $("f-title-pt").value,
            titleEn: $("f-title-en").value,
            bodyPt: $("f-body-pt").value,
            bodyEn: $("f-body-en").value,
          };
        }

        function setEditorStatus(draft) {
          state.draft = draft;
          $("editor-status").textContent = draft
            ? "Status: rascunho — não aparece no blog público."
            : "Status: publicado — visível em /blog.";
          $("btn-publish").hidden = !draft;
          $("btn-unpublish").hidden = draft;
          $("btn-delete").hidden = state.isNew;
          $("editor-title").textContent = state.isNew
            ? "Novo post"
            : draft
              ? "Editar rascunho"
              : "Editar post";
        }

        $("login-form").addEventListener("submit", function (event) {
          event.preventDefault();
          alert_("login-error", "");
          api("POST", "/admin/api/login", { password: $("login-password").value })
            .then(function () {
              state.authenticated = true;
              $("login-password").value = "";
              openList();
            })
            .catch(function (err) { alert_("login-error", err.message); });
        });

        $("btn-logout").addEventListener("click", function () {
          api("POST", "/admin/api/logout").catch(function () {});
          state.authenticated = false;
          show("login");
        });

        function openList() {
          show("list");
          alert_("list-error", "");
          api("GET", "/admin/api/posts")
            .then(function (data) {
              var list = $("post-list");
              list.innerHTML = "";
              var posts = data.posts || [];
              $("list-empty").hidden = posts.length > 0;
              posts.forEach(function (post) {
                var li = document.createElement("li");
                li.className = "admin-item";

                var left = document.createElement("span");
                left.className = "admin-item-title";
                left.textContent = post.titlePt || post.slug;

                var meta = document.createElement("span");
                meta.className = "admin-item-meta";
                var badge = document.createElement("span");
                badge.className = "admin-badge " + (post.draft ? "admin-badge-draft" : "admin-badge-live");
                badge.textContent = post.draft ? "rascunho" : "publicado";
                meta.appendChild(document.createTextNode(post.date + " · "));
                meta.appendChild(badge);

                var actions = document.createElement("span");
                actions.className = "admin-actions";

                var edit = document.createElement("button");
                edit.type = "button";
                edit.className = "admin-btn";
                edit.textContent = "Editar";
                edit.addEventListener("click", function () { openEditor(post, false); });
                actions.appendChild(edit);

                var link = document.createElement("a");
                link.className = "admin-btn admin-btn-ghost";
                link.href = "/blog/" + post.slug;
                link.target = "_blank";
                link.rel = "noreferrer";
                link.textContent = "Ver";
                actions.appendChild(link);

                if (post.draft) {
                  var pub = document.createElement("button");
                  pub.type = "button";
                  pub.className = "admin-btn admin-btn-publish";
                  pub.textContent = "Publicar";
                  pub.addEventListener("click", function () {
                    alert_("list-error", "");
                    api("POST", "/admin/api/posts/" + encodeURIComponent(post.slug) + "/publish")
                      .then(openList)
                      .catch(function (err) { alert_("list-error", err.message); });
                  });
                  actions.appendChild(pub);
                } else {
                  var unpub = document.createElement("button");
                  unpub.type = "button";
                  unpub.className = "admin-btn admin-btn-ghost";
                  unpub.textContent = "Despublicar";
                  unpub.addEventListener("click", function () {
                    if (!confirm("Despublicar “" + post.titlePt + "”? Some do blog público.")) return;
                    alert_("list-error", "");
                    api("POST", "/admin/api/posts/" + encodeURIComponent(post.slug) + "/unpublish")
                      .then(openList)
                      .catch(function (err) { alert_("list-error", err.message); });
                  });
                  actions.appendChild(unpub);
                }

                var del = document.createElement("button");
                del.type = "button";
                del.className = "admin-btn admin-btn-danger";
                del.textContent = "Excluir";
                del.addEventListener("click", function () {
                  if (!confirm("Excluir “" + post.titlePt + "”? Não dá para desfazer.")) return;
                  alert_("list-error", "");
                  api("DELETE", "/admin/api/posts/" + encodeURIComponent(post.slug))
                    .then(openList)
                    .catch(function (err) { alert_("list-error", err.message); });
                });
                actions.appendChild(del);

                li.appendChild(left);
                li.appendChild(meta);
                li.appendChild(actions);
                list.appendChild(li);
              });
            })
            .catch(function (err) { alert_("list-error", err.message); });
        }

        $("btn-new").addEventListener("click", function () {
          openEditor(null, true);
        });

        function openEditor(post, isNew) {
          state.isNew = isNew;
          state.editingSlug = isNew ? null : post.slug;
          state.slugTouched = !isNew;
          $("f-slug").value = isNew ? "" : post.slug;
          $("f-slug").disabled = !isNew;
          $("f-date").value = isNew ? new Date().toISOString().slice(0, 10) : post.date;
          $("f-title-pt").value = isNew ? "" : post.titlePt;
          $("f-title-en").value = isNew ? "" : post.titleEn;
          $("f-body-pt").value = isNew ? "" : post.bodyPt;
          $("f-body-en").value = isNew ? "" : post.bodyEn;
          setEditorStatus(isNew ? true : post.draft);
          alert_("editor-error", "");
          alert_("editor-ok", "");
          show("edit");
        }

        $("f-slug").addEventListener("input", function () {
          state.slugTouched = true;
        });

        $("f-title-pt").addEventListener("input", function () {
          if (!state.isNew || state.slugTouched) return;
          $("f-slug").value = slugify($("f-title-pt").value);
        });

        $("back-link").addEventListener("click", function (event) {
          event.preventDefault();
          openList();
        });

        function afterSave(post, message) {
          state.isNew = false;
          state.editingSlug = post.slug;
          $("f-slug").value = post.slug;
          $("f-slug").disabled = true;
          setEditorStatus(post.draft);
          alert_("editor-ok", message);
        }

        function save(draft) {
          alert_("editor-error", "");
          alert_("editor-ok", "");
          var payload = fields();
          payload.draft = draft;
          var promise;
          if (state.isNew) {
            payload.slug = $("f-slug").value;
            promise = api("POST", "/admin/api/posts", payload);
          } else {
            promise = api("PUT", "/admin/api/posts/" + encodeURIComponent(state.editingSlug), payload);
          }
          return promise;
        }

        $("editor-form").addEventListener("submit", function (event) {
          event.preventDefault();
          save(state.draft)
            .then(function (post) { afterSave(post, state.draft ? "Rascunho salvo." : "Post salvo."); })
            .catch(function (err) { alert_("editor-error", err.message); });
        });

        $("btn-publish").addEventListener("click", function () {
          save(false)
            .then(function (post) { afterSave(post, "Publicado. Está no blog."); })
            .catch(function (err) { alert_("editor-error", err.message); });
        });

        $("btn-unpublish").addEventListener("click", function () {
          if (!confirm("Despublicar este post? Ele some do blog público.")) return;
          save(true)
            .then(function (post) { afterSave(post, "Despublicado. Voltou a rascunho."); })
            .catch(function (err) { alert_("editor-error", err.message); });
        });

        $("btn-delete").addEventListener("click", function () {
          if (!state.editingSlug) return;
          if (!confirm("Excluir este post? Não dá para desfazer.")) return;
          alert_("editor-error", "");
          api("DELETE", "/admin/api/posts/" + encodeURIComponent(state.editingSlug))
            .then(openList)
            .catch(function (err) { alert_("editor-error", err.message); });
        });

        api("GET", "/admin/api/session").then(function (data) {
          if (data.authenticated) openList();
          else show("login");
        }).catch(function () { show("login"); });
      })();
    </script>
  </body>
</html>
